; GTA4VR default controller bindings: /interaction_profiles/htc/vive_controller
; Restart GTA IV to apply edits. Missing keys use built-in defaults.
; Use none (or an empty value) to unbind. Multiple paths: comma-separated.
; Paths must be supported by this controller profile and the action type.
; Guide: GTA4VR-notices/Controller-bindings.md (docs/controller-bindings-ini.md in source).

[hands]
; Thumb pose direction (XR_ACTION_TYPE_VECTOR2F_INPUT)
thumb_direction.left = /user/hand/left/input/trackpad
; Thumb pose direction (XR_ACTION_TYPE_VECTOR2F_INPUT)
thumb_direction.right = /user/hand/right/input/trackpad
; Pointing pose (XR_ACTION_TYPE_POSE_INPUT)
point_pose.left = /user/hand/left/input/aim/pose
; Pointing pose (XR_ACTION_TYPE_POSE_INPUT)
point_pose.right = /user/hand/right/input/aim/pose
; Hand pose (XR_ACTION_TYPE_POSE_INPUT)
hand_pose.left = /user/hand/left/input/grip/pose
; Hand pose (XR_ACTION_TYPE_POSE_INPUT)
hand_pose.right = /user/hand/right/input/grip/pose
; Close free hand (XR_ACTION_TYPE_BOOLEAN_INPUT)
close_hand.left = /user/hand/left/input/squeeze/click
; Close free hand (XR_ACTION_TYPE_BOOLEAN_INPUT)
close_hand.right = /user/hand/right/input/squeeze/click
; Curl index finger (XR_ACTION_TYPE_FLOAT_INPUT)
curl_index.left = /user/hand/left/input/trigger/value
; Curl index finger (XR_ACTION_TYPE_FLOAT_INPUT)
curl_index.right = /user/hand/right/input/trigger/value
; Rest thumb (XR_ACTION_TYPE_BOOLEAN_INPUT)
thumb_contact.left = /user/hand/left/input/trackpad/touch
; Rest thumb (XR_ACTION_TYPE_BOOLEAN_INPUT)
thumb_contact.right = /user/hand/right/input/trackpad/touch

[on_foot]
; Move (vector)
move = /user/hand/left/input/trackpad
; Turn view (vector)
turn = /user/hand/right/input/trackpad
; Enable turning (touch) (boolean)
turn_enable = /user/hand/right/input/trackpad/touch
; Enable movement (touch) (boolean)
move_enable = /user/hand/left/input/trackpad/touch
; Sprint (boolean)
sprint = /user/hand/left/input/trackpad/click
; Jump (boolean)
jump = /user/hand/right/input/trackpad/click
; Enter vehicle (boolean)
interact = /user/hand/right/input/menu/click
; Fire equipped weapon (scalar)
fire = /user/hand/right/input/trigger/value
; Support weapon (boolean)
support_weapon = /user/hand/left/input/squeeze/click
; Grab with left hand (boolean)
grab_left = /user/hand/left/input/squeeze/click
; Grab with right hand (boolean)
grab_right = /user/hand/right/input/squeeze/click
; Activate weapon selection (boolean)
cycle_weapon = /user/hand/right/input/trackpad/click
; Weapon selection direction (vector)
weapon_direction = /user/hand/right/input/trackpad
; Next weapon (boolean)
next_weapon = none
; Previous weapon (boolean)
previous_weapon = none
; Confirm / accept (boolean)
confirm = none
; Interact with shops / vendors (boolean)
context_interact = /user/hand/left/input/trigger/click

[driving]
; Turn view (vector)
turn = /user/hand/right/input/trackpad
; Enable turning (touch) (boolean)
turn_enable = /user/hand/right/input/trackpad/touch
; Steer (vector)
steer = /user/hand/left/input/trackpad
; Enable steering (touch) (boolean)
steer_enable = /user/hand/left/input/trackpad/touch
; Accelerate (scalar)
accelerate = /user/hand/right/input/trigger/value
; Brake / reverse (scalar)
brake = /user/hand/left/input/trigger/value
; Handbrake (boolean)
handbrake = /user/hand/right/input/trackpad/click
; Exit vehicle (boolean)
exit_vehicle = /user/hand/right/input/menu/click
; Fire left-hand weapon (scalar)
fire_left_weapon = /user/hand/left/input/trigger/value
; Brake / reverse with weapon equipped (boolean)
brake_with_weapon = /user/hand/left/input/trackpad/click
; Activate weapon selection (boolean)
cycle_weapon = /user/hand/right/input/trackpad/click
; Weapon selection direction (vector)
weapon_direction = /user/hand/right/input/trackpad
; Next drive-by weapon (boolean)
next_weapon = none
; Previous drive-by weapon (boolean)
previous_weapon = none
; Car horn (boolean)
horn = /user/hand/right/input/trackpad/click
; Open phone (hold) (boolean)
open_phone = /user/hand/left/input/menu/click
; Context interaction (boolean)
context_interact = none
; Confirm / accept (boolean)
confirm = none
; Next radio station (boolean)
radio_next = none
; Previous radio station (boolean)
radio_previous = none

[menus]
; Set / remove map waypoint (boolean)
set_waypoint = /user/hand/right/input/trackpad/click
; Navigation direction (vector)
navigate_direction = /user/hand/right/input/trackpad
; Navigate / confirm (boolean)
navigate_click = /user/hand/right/input/trackpad/click
; Navigate up (boolean)
navigate_up = none
; Navigate down (boolean)
navigate_down = none
; Navigate left (boolean)
navigate_left = none
; Navigate right (boolean)
navigate_right = none
; Confirm (boolean)
confirm = none
; Back / leave interaction (boolean)
interaction_back = /user/hand/right/input/menu/click
; Select / drag (boolean)
select.left = /user/hand/left/input/trigger/click
; Select / drag (boolean)
select.right = /user/hand/right/input/trigger/click
; Back (boolean)
back = /user/hand/right/input/menu/click

[system]
; Pause / skip cutscene (tap) (boolean)
pause = /user/hand/left/input/menu/click
; Open phone (hold) (boolean)
open_phone = /user/hand/left/input/menu/click

[phone]
; Phone navigation direction (vector)
phone_direction = /user/hand/right/input/trackpad
; Phone navigate / accept (boolean)
phone_click = /user/hand/right/input/trackpad/click
; Phone back (boolean)
phone_back = /user/hand/right/input/menu/click
; Phone up / keypad (boolean)
phone_up = none
; Phone down (boolean)
phone_down = none
; Phone left (boolean)
phone_left = none
; Phone right (boolean)
phone_right = none
; Phone accept (boolean)
phone_accept = none
